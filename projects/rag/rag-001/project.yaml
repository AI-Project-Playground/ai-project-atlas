learning_outcomes:
  - Understand why document chunking is required in Retrieval-Augmented Generation systems.
  - Learn how to use LangChain RecursiveCharacterTextSplitter for recursive character-based chunking.
  - Understand how token-based splitting differs from character-based splitting and how tiktoken is used to measure token counts.
  - Learn how to split Markdown documents using heading structure and preserve heading information as chunk metadata.
  - Understand semantic chunking and how Chonkie uses semantic information to identify chunk boundaries.
  - Compare recursive character, token-based, Markdown structure-aware, and semantic chunking strategies.
  - Understand how chunk size and overlap influence the number and content of generated chunks.
  - Learn how BM25 lexical retrieval and dense vector retrieval can be used to evaluate the usefulness of generated chunks.
  - Understand evaluation measures such as answer coverage, Hit@1, Hit@k, and average retrieved context size.
  - Learn how to inspect chunk text and metadata through an interactive Streamlit application.
  - Understand why a chunking strategy should be selected using representative evaluation data rather than a single metric or small test set.

