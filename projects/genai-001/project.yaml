learning_outcomes:
  - Understand the basic request and response flow of an LLM API.
  - Learn how to call an LLM from Python through an API.
  - Understand how prompts are passed to a generative AI model.
  - Understand how generated text is returned by an LLM.
  - Understand how generation limits such as maximum output tokens affect responses.
  - Learn how to make the LLM provider and model configurable.
  - Learn how to handle common API failures such as quota exhaustion, authentication errors, connection failures, and service unavailability.
  - Understand how to expose an LLM application through a Streamlit interface.

