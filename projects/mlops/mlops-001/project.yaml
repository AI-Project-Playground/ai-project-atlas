learning_outcomes:
  - Understand how REST APIs expose application functionality through HTTP endpoints.
  - Build API routes using FastAPI and define request and response models.
  - Use Pydantic to validate incoming API data and enforce field constraints.
  - Understand the role of ASGI and how Uvicorn serves a FastAPI application locally.
  - Connect a separate Streamlit frontend to a FastAPI backend using HTTPX.
  - Deploy a FastAPI backend to Cloudflare Workers and a Streamlit frontend to Streamlit Community Cloud.
  - Understand the separation of frontend hosting and backend hosting in a cloud application.
  - Recognize the limitations of in-memory application storage in a serverless deployment.

