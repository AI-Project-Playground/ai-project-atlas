[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-001-ols-regression"
version = "0.1.0"
description = "Educational implementation of Ordinary Least Squares regression from scratch"
requires-python = ">=3.13"

dependencies = [
    "numpy>=2.0,<3",
    "scikit-learn>=1.6,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]