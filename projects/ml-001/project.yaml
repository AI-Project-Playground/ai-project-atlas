# Concrete things a learner should understand or be able to do.
learning_outcomes:
  - Understand the mathematics behind ordinary least squares regression.
  - Implement linear regression using NumPy without relying on a machine learning library.
  - Understand the role of the design matrix and regression coefficients.
  - Compare a from-scratch implementation with scikit-learn.
  - Evaluate regression models using MSE and R-squared.

