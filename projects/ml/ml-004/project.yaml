learning_outcomes:
  - Explain how a convolution filter slides over an image and produces a feature map.
  - Implement 2D convolution using Python loops and a vectorized NumPy approach.
  - Explain local receptive fields and parameter sharing.
  - Calculate convolution output dimensions from input size, kernel size, padding, and stride.
  - Calculate the trainable parameters in convolutional and fully connected layers.
  - Trace the data flow through convolution, ReLU, flattening, dense classification, and softmax.
  - Implement a small CNN and its backpropagation using NumPy.
  - Validate analytical gradients using finite-difference gradient checking.
  - Train and evaluate the CNN on the scikit-learn handwritten digits dataset.
  - Compare the CNN with a logistic regression baseline.
  - Compare a from-scratch NumPy implementation with an optional PyTorch implementation.
