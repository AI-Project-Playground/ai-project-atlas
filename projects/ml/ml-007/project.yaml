learning_outcomes:
- Explain how bagging combines bootstrap-trained models and reduces variance.
- Explain how Random Forest adds random feature selection to bagged decision trees.
- Distinguish bagging, boosting, voting, and stacking.
- Build and compare individual classifiers and ensemble classifiers for customer churn
  prediction.
- Use pipelines to keep imputation, scaling, and one-hot encoding inside cross-validation
  folds.
- Evaluate binary classifiers using ROC-AUC.
- Calculate top-fraction churn capture for a limited-capacity retention campaign.
- Explain out-of-bag evaluation for bootstrap-based ensembles.
- Interpret why ensemble models may not significantly outperform a strong simple baseline.
