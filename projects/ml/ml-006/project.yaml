learning_outcomes:
- Understand time-series data, trend, seasonality, and noise.
- Explain why time-series observations must remain in chronological order.
- Understand forecast horizon, backtest windows, and step size.
- Apply rolling-origin time-series cross-validation without using future observations
  during training.
- Compare Seasonal Naive, AutoARIMA, AutoETS, and AutoTheta forecasting models.
- Evaluate forecasts using MAE, RMSE, and MAPE.
- Compare advanced forecasting models against a simple seasonal baseline.
- Generate and visualize a 12-month forecast using the full historical dataset.
