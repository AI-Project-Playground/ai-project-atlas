learning_outcomes:
  - Understand clustering as an unsupervised-learning task.
  - Implement K-Means clustering using scikit-learn and explain its assignment and centroid-update steps.
  - Understand inertia and the geometric assumptions and limitations of K-Means.
  - Fit Gaussian Mixture Models using scikit-learn and explain Gaussian components, means, covariance matrices, and mixture weights.
  - Explain the Expectation-Maximization algorithm through its E-step and M-step.
  - Compare hard cluster assignments with GMM soft membership probabilities.
  - Explore GMM covariance types including full, tied, diagonal, and spherical.
  - Compare inertia, silhouette score, Adjusted Rand Index, and GMM BIC.
  - Understand why different cluster-selection criteria can recommend different values of k.
  - Interpret clustering results and recognize the limitations of synthetic experiments.

