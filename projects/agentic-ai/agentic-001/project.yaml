learning_outcomes:
  - Understand the purpose of Model Context Protocol and the host-client-server architecture.
  - Build an MCP server using the official Python MCP SDK v2 and MCPServer.
  - Register typed server functions as MCP tools using decorators.
  - Expose read-only application context through an MCP resource.
  - Expose a reusable prompt template through an MCP prompt.
  - Connect to an MCP server using the Client and stdio subprocess transport.
  - Discover tools, resources, and prompts dynamically instead of hard-coding server capabilities in the client.
  - Invoke MCP tools and interpret successful and error responses.
  - Understand how a Streamlit host application can interact with an MCP server through a real MCP client.
  - Apply explicit user confirmation before invoking a tool that changes state.

