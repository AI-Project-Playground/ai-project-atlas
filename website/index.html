<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Project Atlas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>AI Project Atlas</h1>
        <p>Explore AI and Machine Learning Projects</p>
    </header>

    <main>

        <section id="catalogue-view">
            <h2>Projects</h2>

            <div id="project-list">
                Loading projects...
            </div>
        </section>

        <section id="project-detail-view" hidden>
            <button id="back-to-projects">
                ← Back to Projects
            </button>

            <div id="project-detail">
                Loading project...
            </div>
        </section>

    </main>

    <footer>
        <p>AI Project Atlas</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
