[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-atlas"
version = "0.1.0"
description = "AI Project Atlas validation and ingestion tools"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26,<5",
    "PyYAML>=6.0,<7",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
include = ["validator*", "importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]